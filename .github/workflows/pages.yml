name: Publish gallery
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.json'
      - LICENSE
      - CNAME
      - 'icons/**'
      - 'site/**'
      - 'collection/**'
      - scripts/build_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'fontrevival/font-revival'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/build_site.py
            /site/editor-release.json
      - name: Read pinned private editor release
        id: editor
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          release = json.loads(Path('site/editor-release.json').read_text())
          assert release['repository'] == 'fontrevival/font-revival-editor'
          assert re.fullmatch(r'[0-9a-f]{40}', release['commit'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('commit=' + release['commit'], file=output)
          PY
      - name: Check out private editor source
        uses: actions/checkout@v4
        with:
          repository: fontrevival/font-revival-editor
          ref: ${{ steps.editor.outputs.commit }}
          ssh-key: ${{ secrets.EDITOR_DEPLOY_KEY }}
          persist-credentials: false
          path: .editor-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .editor-source/package-lock.json
      - name: Build proprietary editor distribution
        working-directory: .editor-source
        env:
          FONT_REVIVAL_CATALOGUE: ..
          GOOGLE_CLIENT_ID: ${{ vars.EDITOR_GOOGLE_CLIENT_ID }}
          DROPBOX_CLIENT_ID: ${{ vars.EDITOR_DROPBOX_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ vars.EDITOR_MICROSOFT_CLIENT_ID }}
        run: |
          npm ci
          npm test
          npm run build
          cp -R dist ../editor
      - name: Restore packed artwork cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/font-revival-pages-cache
          key: pages-artwork-${{ runner.os }}-${{ hashFiles('scripts/build_site.py') }}-${{ github.sha }}
          restore-keys: |
            pages-artwork-${{ runner.os }}-${{ hashFiles('scripts/build_site.py') }}-
      - uses: actions/configure-pages@v5
      - name: Assemble static gallery
        run: python3 scripts/build_site.py --git-source --cache "$RUNNER_TEMP/font-revival-pages-cache"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
