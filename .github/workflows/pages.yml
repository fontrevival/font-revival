name: Publish gallery
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.json'
      - LICENSE
      - CNAME
      - 'icons/**'
      - 'site/**'
      - 'collection/**'
      - scripts/build_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'haroldus-/font-revival'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/build_site.py
      - name: Restore packed artwork cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/font-revival-pages-cache
          key: pages-artwork-${{ runner.os }}-${{ hashFiles('scripts/build_site.py') }}-${{ github.sha }}
          restore-keys: |
            pages-artwork-${{ runner.os }}-${{ hashFiles('scripts/build_site.py') }}-
      - uses: actions/configure-pages@v5
      - name: Assemble static gallery
        run: python3 scripts/build_site.py --git-source --cache "$RUNNER_TEMP/font-revival-pages-cache"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
